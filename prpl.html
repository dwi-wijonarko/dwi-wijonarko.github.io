<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Nilai Mahasiswa - PRPL</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-light: #dbeafe;
    --border: #e5e7eb;
    --danger: #ef4444;
    --danger-light: #fef2f2;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 640px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 28px; }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .header p { color: var(--muted); font-size: 14px; }
  .search-card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .search-form { display: flex; gap: 10px; }
  .search-form input {
    flex: 1;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
    color: var(--text);
  }
  .search-form input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .search-form button {
    padding: 14px 24px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .search-form button:hover:not(:disabled) { background: #1d4ed8; }
  .search-form button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .status {
    text-align: center;
    padding: 14px;
    color: var(--muted);
    font-size: 14px;
  }
  .status.error { color: var(--danger); }
  .result { display: none; }
  .result.show { display: block; }
  .result-card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .result-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .result-nim {
    color: var(--muted);
    font-size: 14px;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    letter-spacing: 0.02em;
  }
  .grade-badge {
    background: var(--accent-light);
    color: var(--accent);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    min-width: 64px;
    text-align: center;
  }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 3), 1fr);
    gap: 16px;
  }
  .result-item { padding: 4px 0; }
  .result-item-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .result-item-value { font-size: 17px; font-weight: 500; }
  .result-item-value.muted { color: var(--muted); font-weight: 400; }
  .section-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    margin: 18px 0 12px 0;
    padding-bottom: 6px;
    border-bottom: 1px dashed var(--border);
  }
  .section-label-bobot {
    color: var(--muted);
    font-size: 10px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
  }
  .not-found {
    background: var(--danger-light);
    color: var(--danger);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #fee2e2;
  }
  .not-found-title { font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .not-found-desc { font-size: 13px; color: #991b1b; }
  .loading-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 32px;
  }
  @media (max-width: 480px) {
    .search-form { flex-direction: column; }
    .result-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .header h1 { font-size: 22px; }
    .result-header { flex-direction: column; align-items: stretch; }
    .grade-badge { align-self: flex-start; }
  }
</style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Cari Nilai Mahasiswa</h1>
      <p>Masukkan NIM untuk melihat data nilai akhir matakuliah PRPL</p>
    </header>

    <div class="search-card">
      <form class="search-form" id="search-form">
        <input
          type="text"
          id="nim-input"
          placeholder="Contoh: 262410102001"
          inputmode="numeric"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" id="search-btn" disabled>Memuat...</button>
      </form>
      <p class="hint">Tekan Enter atau klik Cari</p>
    </div>

    <div class="status" id="status">
      <span class="loading-spinner"></span>Memuat data...
    </div>

    <div class="result" id="result"></div>

    <footer class="footer">
      Nilai Mata Kuliah PRPL (KST1105) - Gasal 2026/2027
    </footer>
  </div>

  <script>
    (function () {
      // ============================================================
      // KONFIGURASI
      // Ganti SHEET_ID bila Anda pakai sheet lain (lihat di URL sheet)
      // ============================================================
      const SHEET_ID = '1Ym8nwU5uumiXFrFFzwX8KU_7CMttSrEr';
      const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

      // Daftar kolom komponen nilai (index = posisi kolom di sheet, A = 0).
      // Kolom D, E, F dikecualikan (excluded: true) sehingga tidak dimunculkan.
      // Sistem hanya menampilkan kolom yang benar-benar memiliki nilai.
      const COMPONENTS = [
        { col: 3, label: 'Aktifitas Partisipatif', excluded: true }, // D
        { col: 4, label: 'Hasil Proyek',           excluded: true }, // E
        { col: 5, label: 'Tugas',                  excluded: true }, // F
        { col: 6, label: 'Quiz' },                                // G
        { col: 7, label: 'UTS' },                                 // H
        { col: 8, label: 'UAS' },                                 // I
      ];

      let students = [];
      let loaded = false;

      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      const form = document.getElementById('search-form');
      const input = document.getElementById('nim-input');
      const btn = document.getElementById('search-btn');

      function cellRaw(c, idx) {
        const cell = c[idx];
        if (!cell) return '';
        const raw = cell.f != null ? cell.f : cell.v;
        if (raw == null) return '';
        return String(raw).trim();
      }

      function numOrDash(val) {
        if (!val) return '';
        const n = Number(val);
        return isNaN(n) ? val : String(n);
      }

      // ============================================================
      // AMBIL DATA DARI GOOGLE SHEET (gviz API, return JSON)
      // ============================================================
      async function loadSheet() {
        try {
          const res = await fetch(GVIZ_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();

          // gviz membungkus JSON dengan: /*O_o*/\ngoogle.visualization.Query.setResponse({...});
          const jsonStart = text.indexOf('{');
          const jsonEnd = text.lastIndexOf('}');
          if (jsonStart === -1 || jsonEnd === -1) {
            throw new Error('Format respons tidak dikenali');
          }
          const data = JSON.parse(text.substring(jsonStart, jsonEnd + 1));
          const rows = (data.table && data.table.rows) || [];

          // Baris pertama berisi bobot (D=0, E=0, F=0, G=0.2, H=0.3, I=0.5)
          const weightRow = rows[0] && rows[0].c ? rows[0].c : [];
          function weightOf(col) {
            const raw = cellRaw(weightRow, col);
            if (!raw) return '';
            const n = Number(raw);
            if (isNaN(n) || n <= 0) return '';
            return Math.round(n * 100) + '%';
          }

          for (const row of rows) {
            const c = row.c || [];
            const nimRaw = c[1] && c[1].v;
            if (nimRaw == null) continue;
            const nimStr = String(nimRaw).trim();
            // NIM valid = 12 digit angka (filter baris header/info)
            if (!/^\d{12}$/.test(nimStr)) continue;

            const nama = cellRaw(c, 2) || '-';
            const nilaiAngka = numOrDash(cellRaw(c, 9)) || '-';
            const nilaiHuruf = cellRaw(c, 10) || '-';
            const kehadiran = cellRaw(c, 11) || '-';

            // Hanya komponen yang TIDAK dikecualikan DAN memiliki nilai
            const komponen = [];
            for (const comp of COMPONENTS) {
              if (comp.excluded) continue;
              const value = cellRaw(c, comp.col);
              if (value === '') continue;
              komponen.push({
                label: comp.label,
                bobot: weightOf(comp.col),
                value: numOrDash(value),
              });
            }

            students.push({
              nim: nimStr,
              nama: nama,
              komponen: komponen,
              nilaiAngka: nilaiAngka,
              nilaiHuruf: nilaiHuruf,
              kehadiran: kehadiran,
            });
          }

          if (students.length === 0) {
            throw new Error('Tidak ada baris mahasiswa yang valid terbaca.');
          }

          loaded = true;
          statusEl.style.display = 'none';
          btn.disabled = false;
          btn.textContent = 'Cari';
          input.focus();
        } catch (err) {
          statusEl.classList.add('error');
          statusEl.innerHTML = `Gagal memuat data: ${escapeHtml(err.message)}.<br/>Coba refresh halaman, atau pastikan koneksi internet aktif.`;
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));
      }

      // ============================================================
      // CARI NIM
      // ============================================================
      function search(nim) {
        const clean = nim.trim();
        resultEl.classList.remove('show');

        if (!clean) {
          resultEl.innerHTML = '';
          return;
        }

        const found = students.find(s => s.nim === clean);

        if (!found) {
          resultEl.innerHTML = `
            <div class="not-found">
              <div class="not-found-title">NIM ${escapeHtml(clean)} tidak ditemukan</div>
              <div class="not-found-desc">Periksa kembali NIM yang Anda masukkan, atau hubungi dosen pengampu.</div>
            </div>
          `;
        } else {
          const cols = Math.max(found.komponen.length, 1);
          const komponenHtml = found.komponen.map(k => `
            <div class="result-item">
              <div class="result-item-label">${escapeHtml(k.label)}${k.bobot ? ` <span class="section-label-bobot">${k.bobot}</span>` : ''}</div>
              <div class="result-item-value">${escapeHtml(k.value)}</div>
            </div>
          `).join('');

          const komponenSection = found.komponen.length > 0 ? `
            <div class="section-label">Komponen Nilai <span class="section-label-bobot">(bobot)</span></div>
            <div class="result-grid" style="--cols: ${cols}">${komponenHtml}</div>
          ` : '';

          resultEl.innerHTML = `
            <div class="result-card">
              <div class="result-header">
                <div>
                  <div class="result-name">${escapeHtml(found.nama)}</div>
                  <div class="result-nim">NIM: ${escapeHtml(found.nim)}</div>
                </div>
                <div class="grade-badge">${escapeHtml(found.nilaiHuruf)}</div>
              </div>

              ${komponenSection}

              <div class="section-label">Nilai Akhir</div>
              <div class="result-grid" style="--cols: 3">
                <div class="result-item">
                  <div class="result-item-label">Nilai Angka</div>
                  <div class="result-item-value">${escapeHtml(found.nilaiAngka)}</div>
                </div>
                <div class="result-item">
                  <div class="result-item-label">Nilai Huruf</div>
                  <div class="result-item-value">${escapeHtml(found.nilaiHuruf)}</div>
                </div>
                <div class="result-item">
                  <div class="result-item-label">Kehadiran</div>
                  <div class="result-item-value">${escapeHtml(found.kehadiran)}</div>
                </div>
              </div>
            </div>
          `;
        }
        resultEl.classList.add('show');
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!loaded) return;
        search(input.value);
      });

      loadSheet();
    })();
  </script>
</body>
</html>
