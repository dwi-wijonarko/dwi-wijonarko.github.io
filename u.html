<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penilaian Ujian Skripsi - UNEJ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .student-info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .info-item {
            display: flex;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 600;
            min-width: 120px;
        }

        .info-value {
            flex: 1;
        }

        .info-value input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0;
            font-size: 14px;
            color: white;
        }

        .info-value input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .info-value input:focus {
            outline: none;
        }

        .form-section {
            padding: 20px;
        }

        .assessment-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .assessment-item:hover {
            border-color: #667eea;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.1);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .item-number {
            background: #667eea;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .item-title {
            flex: 1;
            padding: 0 12px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
        }

        .item-weight {
            background: #ffd93d;
            color: #333;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .score-selector {
            display: flex;
            gap: 8px;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .score-btn {
            flex: 1;
            padding: 10px 5px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #666;
            transition: all 0.2s ease;
        }

        .score-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .score-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .result-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .result-label {
            font-size: 13px;
            color: #666;
        }

        .result-value {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }

        .total-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            margin-top: 20px;
            color: white;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .total-label {
            font-size: 16px;
            font-weight: 600;
        }

        .total-value {
            font-size: 28px;
            font-weight: bold;
        }

        .grade-display {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 15px;
        }

        .grade-label {
            font-size: 14px;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .grade-value {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .action-buttons {
            padding: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset {
            background: #ff6b6b;
            color: white;
        }

        .btn-reset:hover {
            background: #ee5a52;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,107,107,0.3);
        }

        .btn-print {
            background: #51cf66;
            color: white;
        }

        .btn-print:hover {
            background: #40c057;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(81,207,102,0.3);
        }

        .footer {
            text-align: center;
            padding: 15px;
            color: #999;
            font-size: 11px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
            }
            .action-buttons {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LEMBAR PENILAIAN UJIAN SKRIPSI</h1>
            <div class="student-info">
                <div class="info-item">
                    <span class="info-label">Nama Mahasiswa</span>
                    <span class="info-value">: <input type="text" id="namaMahasiswa" placeholder="Masukkan nama"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">Nomor Induk</span>
                    <span class="info-value">: <input type="text" id="nimMahasiswa" placeholder="Masukkan NIM"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">Program Studi</span>
                    <span class="info-value">: <input type="text" id="prodiMahasiswa" placeholder="Masukkan prodi"></span>
                </div>
            </div>
        </div>

        <div class="form-section" id="assessmentForm">
            <!-- Items will be generated by JavaScript -->
        </div>

        <div class="total-section">
            <div class="total-row">
                <span class="total-label">Total Bobot:</span>
                <span class="total-value" id="totalBobot">20</span>
            </div>
            <div class="total-row">
                <span class="total-label">Total Nilai (Σ Skor × Bobot):</span>
                <span class="total-value" id="totalNilai">0</span>
            </div>
            <div class="grade-display">
                <div class="grade-label">Nilai Akhir</div>
                <div class="grade-value" id="nilaiAkhir">0</div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-reset" onclick="resetForm()">Reset</button>
            <button class="btn btn-print" onclick="window.print()">Cetak</button>
        </div>

        <div class="footer">
            Senin, 19 Januari 2026
        </div>
    </div>

    <script>
        const assessmentItems = [
            { no: 1, name: "Kejelasan Latar Belakang Masalah", scores: [1,2,3,4,5], weight: 1 },
            { no: 2, name: "Kebaruan Penelitian", scores: [1,2,3,4,5], weight: 1 },
            { no: 3, name: "Ketepatan Perumusan Masalah", scores: [1,3,5], weight: 1 },
            { no: 4, name: "Ketepatan Perumusan Tujuan", scores: [1,3,5], weight: 1 },
            { no: 5, name: "Ketepatan Penggunaan Teori", scores: [1,2,3,4,5], weight: 1 },
            { no: 6, name: "Ketepatan Penggunaan Metode Penyelesaian Masalah", scores: [1,2,3,4,5], weight: 2 },
            { no: 7, name: "Kejelasan Langkah-langkah Penelitian", scores: [1,3,5], weight: 1 },
            { no: 8, name: "Kejelasan Pemaparan Hasil Penelitian", scores: [1,2,3,4,5], weight: 1 },
            { no: 9, name: "Ketajaman Analisis dan Pembahasan", scores: [1,2,3,4,5], weight: 1 },
            { no: 10, name: "Ketepatan Penarikan Kesimpulan", scores: [1,3,5], weight: 1 },
            { no: 11, name: "Ketepatan Penggunaan Tata Bahasa dan Sistematika Penulisan", scores: [1,2,3,4,5], weight: 1 },
            { no: 12, name: "Produk Yang Dihasilkan", scores: [1,3,5], weight: 1 },
            { no: 13, name: "Kemampuan Presentasi dan Penguasaan Substansi Penelitian", scores: [1,2,3,4,5], weight: 3 },
            { no: 14, name: "Kemampuan Menjawab Pertanyaan", scores: [1,2,3,4,5], weight: 3 },
            { no: 15, name: "Penggunaan Media Presentasi", scores: [1,3,5], weight: 1 }
        ];

        let selectedScores = {};

        function initializeForm() {
            const formSection = document.getElementById('assessmentForm');
            
            assessmentItems.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'assessment-item';
                itemDiv.innerHTML = `
                    <div class="item-header">
                        <div class="item-number">${item.no}</div>
                        <div class="item-title">${item.name}</div>
                        <div class="item-weight">Bobot: ${item.weight}</div>
                    </div>
                    <div class="score-selector" id="selector-${item.no}">
                        ${item.scores.map(score => `
                            <button class="score-btn" onclick="selectScore(${item.no}, ${score}, ${item.weight})">${score}</button>
                        `).join('')}
                    </div>
                    <div class="result-display">
                        <span class="result-label">Skor × Bobot</span>
                        <span class="result-value" id="result-${item.no}">0</span>
                    </div>
                `;
                formSection.appendChild(itemDiv);
            });
        }

        function selectScore(itemNo, score, weight) {
            // Update selected score
            selectedScores[itemNo] = { score, weight };
            
            // Update button states
            const selector = document.getElementById(`selector-${itemNo}`);
            const buttons = selector.querySelectorAll('.score-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.textContent) === score) {
                    btn.classList.add('active');
                }
            });
            
            // Calculate and display result
            const result = score * weight;
            document.getElementById(`result-${itemNo}`).textContent = result;
            
            // Update total
            updateTotal();
        }

        function updateTotal() {
            let totalNilai = 0;
            let totalBobot = 0;
            
            assessmentItems.forEach(item => {
                totalBobot += item.weight;
                if (selectedScores[item.no]) {
                    totalNilai += selectedScores[item.no].score * selectedScores[item.no].weight;
                }
            });
            
            document.getElementById('totalBobot').textContent = totalBobot;
            document.getElementById('totalNilai').textContent = totalNilai;
            
            // Calculate final grade (Nilai Akhir)
            const nilaiAkhir = totalBobot > 0 ? (totalNilai / totalBobot) * 20 : 0;
            document.getElementById('nilaiAkhir').textContent = nilaiAkhir.toFixed(2);
        }

        function resetForm() {
            if (confirm('Apakah Anda yakin ingin mereset semua penilaian?')) {
                selectedScores = {};
                
                // Reset all buttons and results
                assessmentItems.forEach(item => {
                    const selector = document.getElementById(`selector-${item.no}`);
                    const buttons = selector.querySelectorAll('.score-btn');
                    buttons.forEach(btn => btn.classList.remove('active'));
                    document.getElementById(`result-${item.no}`).textContent = '0';
                });
                
                // Reset totals
                updateTotal();
            }
        }

        // Initialize form on page load
        document.addEventListener('DOMContentLoaded', initializeForm);
    </script>
</body>
</html>
